services:
  web:
    build:
      context: .
      dockerfile: dashboard/Dockerfile
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    ports:
      - "3000:3000"
    command: >
      sh -c "if [ ! -d /app/node_modules/ethers ]; then npm install ethers@6; fi
      && node dashboard/server.js"
    restart: unless-stopped

volumes:
  node_modules:
